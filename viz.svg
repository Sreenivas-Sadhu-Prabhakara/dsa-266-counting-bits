<text x="56.0" y="183.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Shifting right drops only the lowest bit, whose value is i&amp;1 — and i&gt;&gt;1 is ALREADY</text>
